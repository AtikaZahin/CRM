<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capstone CRM</title>
  <meta name="description" content="Capstone CRM — manage your pipeline, leads, contacts and deals." />

  <!-- Prevent flash of unstyled background and declare local system font stack for air-gap resilience -->
  <style>
    html,
    body {
      background: #f7f6fb;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <!-- Optional online fonts (gracefully bypassed in offline / air-gapped environments) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
